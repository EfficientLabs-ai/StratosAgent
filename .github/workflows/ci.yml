name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      # Prove the operating loop end-to-end on every OS: trace → eval must PASS 6/6.
      - name: operating-loop smoke (trace -> eval verifies)
        run: |
          node bin/stratos.js workspace create ci
          node bin/stratos.js task create ci/p/f/t1
          node bin/stratos.js capture ci/p/f/t1 "ci smoke"
          node bin/stratos.js trace ci/p/f/t1
          node bin/stratos.js eval ci/p/f/t1
        shell: bash
